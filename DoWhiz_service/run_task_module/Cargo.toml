[package]
name = "run_task_module"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[[bin]]
name = "load_test"
path = "src/bin/load_test.rs"

[[bin]]
name = "timing_cli"
path = "src/bin/timing_cli.rs"

[dev-dependencies]
tempfile = "3"
